# Compose project for Beket Margulan (it2-2302, ID 38109)
# Start:  docker compose up -d --build
name: beket-margulan-student-api

services:
  postgres:
    image: postgres:16-alpine
    container_name: beket-margulan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentdb}
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - beket-margulan-pgdata:/var/lib/postgresql/data
    networks:
      - beket-margulan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: beket-margulan-student-api:${APP_TAG:-v1.0-beket-margulan-38109}
    container_name: beket-margulan-student-api
    environment:
      # "postgres" is the service name — Docker DNS resolves it inside the network
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-studentdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_VERSION: ${APP_TAG:-v1.0-beket-margulan-38109}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beket-margulan-net
    restart: unless-stopped

volumes:
  beket-margulan-pgdata:

networks:
  beket-margulan-net:
    driver: bridge
