spring.application.name=beket-margulan-student-api
server.port=8080

# Version shown on / and /api/beket-margulan/info (Task 3.3: change and rebuild)
app.version=${APP_VERSION:v1.0-beket-margulan}

# Database settings come from environment variables (docker-compose.yml / .env).
# Defaults point to the Docker service name "postgres", not localhost.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
